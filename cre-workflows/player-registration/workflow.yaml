# ==========================================================================
# CRE WORKFLOW: Player Registration
# ==========================================================================
# Triggered by RegistrationRequested event
# Validates and registers player, sends funding, returns result via confirmRegistration callback

staging-settings:
  user-workflow:
    workflow-name: "player-registration-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "player-registration-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
