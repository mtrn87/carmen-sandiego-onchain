# ==========================================================================
# CRE WORKFLOW: Player Check
# ==========================================================================
# Triggered by PlayerCheckRequested event
# Reads player data and returns result via recordCheckResult callback

staging-settings:
  user-workflow:
    workflow-name: "player-check-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "player-check-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
