# ==========================================================================
# CRE PROJECT SETTINGS FILE
# Carmen Sandiego On-Chain — Chainlink CRE / Keystone Configuration
# ==========================================================================
#
# This file configures the Chainlink Runtime Environment (CRE) for all
# 6 WASM workflows that power the "Carmen Sandiego On-Chain" game.
#
# CHAINLINK CRE OVERVIEW:
#   CRE (formerly Keystone) is Chainlink's compute platform that compiles
#   TypeScript workflows into WASM modules and deploys them to a
#   Decentralized Oracle Network (DON). The DON executes workflows in
#   response to on-chain events or cron schedules, reaches consensus on
#   results, and delivers signed reports back to the blockchain.
#
#   This project uses CRE as a DECENTRALIZED GAME ENGINE — all game logic
#   runs inside the DON with zero centralized server dependency.
#
# WORKFLOWS DEPLOYED:
#   1. mission-start        — Core clue engine (LogTrigger: InvestigationSubmitted)
#   2. generate-briefing    — Mission narrative generator (LogTrigger: MissionStarted)
#   3. generate-finale      — Victory NFT minter (LogTrigger: CarmenCaptured)
#   4. carmen-moves          — Carmen relocation (CronCapability: every 3 min)
#   5. player-registration  — Gasless onboarding (LogTrigger: RegistrationRequested)
#   6. player-check         — Player verification (LogTrigger: PlayerCheckRequested)
#   7. citynode-resolver    — Cross-chain CityNode request resolver
#                              (LogTrigger: ClueRequested/DossierRequested/CaptureRequested)
#
# RPC CONFIGURATION:
#   Each workflow reads from and writes to Ethereum Sepolia, where the
#   GameMaster, GameMasterProxy, PlayerRegistry, and MissionNFT contracts
#   are deployed. The EVMClient uses these RPC endpoints for callContract()
#   (reads) and writeReport() (writes via Keystone Forwarder).
#
# PROJECT-SPECIFIC SETTINGS:
#   Each target defines cre-cli, account, and rpcs groups.
#
# Example custom target:
# my-target:
#   account:
#     workflow-owner-address: "0x123..."            # Optional: Owner wallet/MSIG address (used for --unsigned transactions)
#   rpcs:
#     - chain-name: ethereum-testnet-sepolia        # Required if your workflow interacts with this chain
#       url: "<select your own rpc url>"
#     - chain-name: ethereum-mainnet                # Required if your workflow interacts with this chain
#       url: "<select your own rpc url>"
#
# Experimental chains (automatically used by the simulator when present):
# Use this for chains not yet in official chain-selectors (e.g., hackathons, new chain integrations).
# In your workflow, reference the chain as evm:ChainSelector:<chain-selector>@1.0.0
#
#   experimental-chains:
#     - chain-selector: 12345                       # The chain selector value
#       rpc-url: "https://rpc.example.com"          # RPC endpoint URL
#       forwarder: "0x..."                          # Forwarder contract address on the chain

# ==========================================================================
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
